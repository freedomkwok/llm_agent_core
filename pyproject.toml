# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imp-agent-core"
version = "0.1.0"
description = "Google ADK based chat agent scaffold"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.27.1",
    "litellm>=1.75.5",
    "python-dotenv>=1.0.1",
    "langfuse>=4.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "uvicorn>=0.34.0",
    "zep-cloud>=3.0.0",
    "a2a-sdk>=0.3.4",
    "google-cloud-aiplatform[agent_engines, adk]>=1.112.0",
    "llm-inference-core",
    "graphiti-core[oracle]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12.20250516",
]
jupyter = [
    "ipykernel>=6.29.0",
]


[tool.setuptools]
py-modules = ["agent", "app"]
packages = [
    "imp_agent_core.agents",
    "imp_agent_core.agents.agent_core",
    "imp_agent_core.agents.agent_core.a2a",
    "imp_agent_core.agents.agent_core.adk",
    "imp_agent_core.agents.agent_core.inference",
    "imp_agent_core.agents.agent_core.routing",
    "imp_agent_core.agents.agent_core.sub_agent_invoke",
    "imp_agent_core.agents.zep_agent",
    "imp_agent_core.agents.zep_agent.tools",
]

[tool.setuptools.package-dir]
"imp_agent_core.agents" = "agents"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.uv.sources]
llm-inference-core = { path = "../llm_inference_core", editable = true }
graphiti-core = { path = "../graphiti", editable = true }