# Agent Card metadata exposed to A2A clients/discovery.
card_config:
  # Human-readable agent name shown in card listings.
  agent_name: Zep Tool Agent
  # High-level description of the agent capability.
  description: >
    An LLM tool-calling agent that uses Zep graph search and node-edge exploration
    to pick a strong skill candidate.
  # Skill(s) advertised by this agent card.
  skills:
    # Stable capability identifier used by routing/filtering.
    - id: route_with_zep_tools
      # Human-readable skill name.
      name: Route With Zep Tools
      # What this skill does.
      description: Uses Zep graph tools to inspect nodes/edges and choose the best skill candidate.
      # Tags used by resolver matching and search.
      tags:
        - routing
        - zep
        - tool-calling
        - skill-selection
      # Example user intents for this skill.
      examples:
        - Search which skill should handle this user request.
        - Inspect node edges and choose the strongest skill match.

# Runtime executor wiring for this agent.
executor_config:
  # Import path to the callable that builds the ADK agent instance.
  adk_agent_builder: agents.zep_agent.a2a_agent_core.build_zep_llm_agent
  # Prompt name used by llm_inference_core prompt versioning for agent instruction.
  instruction_prompt_name: agents/zep_query_agent/instruction
  # Prompt label used when resolving instruction prompt from Langfuse/file provider.
  instruction_prompt_label: production
  # Langfuse chain observation name for executor runs.
  trace_name: zep_agent_executor
  # Artifact name used when writing task result content.
  artifact_name: zep_agent
  # Fallback text returned when execution fails without usable output.
  failed_text_message: Failed to generate a zep agent response with text content.
